name: comeya

services:
  db:
    image: postgres:16-alpine
    container_name: comeya-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: comeya_dev
      POSTGRES_USER: comeya
      POSTGRES_PASSWORD: comeya_local_only
    ports:
      - "5444:5432"
    volumes:
      - comeya_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comeya -d comeya_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  comeya_postgres_dev:
